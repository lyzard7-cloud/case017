<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASE 017 · 교사용 대시보드</title>
<style>
:root{--bg:#071019;--p:#0d1721;--l:#223744;--t:#eef6fa;--m:#91a6b1;--a:#41d9ff;--ok:#78e2a7;--w:#ffd66b;--bad:#ff7e8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.app{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:28px}.muted{color:var(--m)}.summary{display:grid;grid-template-columns:repeat(6,minmax(110px,1fr));gap:10px;margin:18px 0}
.stat,.card{background:var(--p);border:1px solid var(--l);border-radius:16px;padding:14px}.stat b{display:block;font-size:28px;color:var(--a)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:1px solid var(--l);background:#112432;color:var(--t);border-radius:12px;padding:10px 14px;cursor:pointer}.approve{background:#153b29;border-color:#2f7050}.reject{background:#3a1d22;border-color:#74404a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card.pending{border-color:#9a7b2a;box-shadow:0 0 0 1px #9a7b2a55}.row{display:flex;justify-content:space-between;gap:10px}.badge{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid var(--l)}.badge.pending{color:var(--w)}.badge.approved{color:var(--ok)}.badge.rejected{color:var(--bad)}
.answer{white-space:pre-wrap;background:#08131b;border:1px solid var(--l);border-radius:12px;padding:11px;min-height:74px;margin:10px 0;line-height:1.55}
textarea,input{width:100%;background:#08131b;color:var(--t);border:1px solid var(--l);border-radius:11px;padding:10px;font:inherit}textarea{min-height:70px;resize:vertical}.hidden{display:none}
@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="app">
<div class="top"><div><div class="muted">강일 심화과학반</div><h1>CASE 017 교사용 대시보드</h1></div><div id="conn" class="muted">Firebase 연결 중...</div></div>

<div id="loginBox" class="card" style="max-width:420px;margin:30px auto">
<h2>교사용 입장</h2><p class="muted">수업용 PIN을 입력하십시오.</p>
<input id="pin" type="password" inputmode="numeric" placeholder="PIN">
<button class="btn" style="width:100%;margin-top:10px" onclick="teacherLogin()">대시보드 열기</button>
</div>

<div id="dashboard" class="hidden">
<div class="summary">
<div class="stat"><span class="muted">접속 학생</span><b id="sTotal">0</b></div>
<div class="stat"><span class="muted">승인 대기</span><b id="sPending">0</b></div>
<div class="stat"><span class="muted">Q1</span><b id="sQ1">0</b></div>
<div class="stat"><span class="muted">Q2</span><b id="sQ2">0</b></div>
<div class="stat"><span class="muted">Q3</span><b id="sQ3">0</b></div>
<div class="stat"><span class="muted">Q4</span><b id="sQ4">0</b></div>
</div>
<div class="controls"><button class="btn" onclick="setFilter('all')">전체</button><button class="btn" onclick="setFilter('pending')">승인 대기만</button><button class="btn" onclick="setFilter('A')">A팀</button><button class="btn" onclick="setFilter('B')">B팀</button><button class="btn" onclick="setFilter('C')">C팀</button><button class="btn" onclick="setFilter('D')">D팀</button></div>
<div id="students" class="grid"></div>
</div>
</div>
<script>
function teacherLogin(){
  if(document.getElementById("pin").value!=="017"){alert("PIN이 올바르지 않습니다.");return}
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  window.startTeacherDashboard?.();
}
</script>
<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

let all=[], filter="all", started=false, unsub=null;
const conn=document.getElementById("conn");
const configured=firebaseConfig?.apiKey && !firebaseConfig.apiKey.includes("여기에");
if(!configured){conn.textContent="firebase-config.js 설정 필요";}

window.startTeacherDashboard=()=>{
  if(started||!configured)return;
  started=true;
  const app=initializeApp(firebaseConfig); const db=getFirestore(app);
  conn.textContent="실시간 연결됨";
  unsub=onSnapshot(collection(db,"case017_students"),snap=>{
    all=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  },e=>{console.error(e);conn.textContent="Firestore 연결 오류";});
  window.case017db=db;
};
window.setFilter=(f)=>{filter=f;render()};

function render(){
  const now=[...all].sort((a,b)=>{
    const pa=a.reviewStatus==="pending"?0:1, pb=b.reviewStatus==="pending"?0:1;
    if(pa!==pb)return pa-pb;
    return String(a.team||"").localeCompare(String(b.team||"")) || String(a.agent||"").localeCompare(String(b.agent||""));
  });
  document.getElementById("sTotal").textContent=all.length;
  document.getElementById("sPending").textContent=all.filter(x=>x.reviewStatus==="pending").length;
  [1,2,3,4].forEach(q=>document.getElementById("sQ"+q).textContent=all.filter(x=>Number(x.currentQuest)===q).length);
  let arr=now.filter(x=>filter==="all"||filter==="pending"&&x.reviewStatus==="pending"||x.team===filter);
  document.getElementById("students").innerHTML=arr.map(card).join("");
}
function esc(s=""){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function card(s){
  const status=s.reviewStatus||"none", q=s.currentQuest||"-", done=(s.completed||[]).join(", ")||"없음";
  return `<div class="card ${status==="pending"?"pending":""}">
    <div class="row"><div><b>${esc(s.agent||"이름없음")}</b> <span class="badge">${esc(s.team||"-")}팀</span></div><span class="badge ${status}">${status==="pending"?"승인 대기":status==="approved"?"승인":status==="rejected"?"반려":"진행중"}</span></div>
    <p class="muted">현재 Q${q} · 완료: ${done}</p>
    ${status==="pending"?`<div class="answer">${esc(s.submittedAnswer||"")}</div>
    <textarea id="fb-${s.id}" placeholder="반려 시 피드백 (선택)"></textarea>
    <div class="row" style="margin-top:9px"><button class="btn approve" onclick="approve('${s.id}',${Number(s.reviewQuest||q)})">통과</button><button class="btn reject" onclick="rejectStudent('${s.id}',${Number(s.reviewQuest||q)})">반려</button></div>`:""}
  </div>`;
}
window.approve=async(id,q)=>{
  const db=window.case017db;if(!db)return;
  await updateDoc(doc(db,"case017_students",id),{reviewStatus:"approved",reviewQuest:q,teacherFeedback:"",reviewedAt:serverTimestamp(),lastUpdated:serverTimestamp()});
};
window.rejectStudent=async(id,q)=>{
  const db=window.case017db;if(!db)return;
  const fb=document.getElementById("fb-"+id)?.value.trim()||"과학적 근거를 보완한 뒤 다시 제출하세요.";
  await updateDoc(doc(db,"case017_students",id),{reviewStatus:"rejected",reviewQuest:q,teacherFeedback:fb,reviewedAt:serverTimestamp(),lastUpdated:serverTimestamp()});
};
</script></body></html>
